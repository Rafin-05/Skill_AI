<style>
/* Layout: survey-chart identity. Contour lines, a swinging compass needle, a radar "compass rose" for skills, and a vertical trail for milestones. Palette follows the blueprint. */
:root {
  --bg: #F8FAFC; --surface: #FFFFFF; --ink: #102B46; --fg: #334155; --muted: #5B6B80; --line: #E2E8F0;
  --accent: #0F766E; --accent-fg: #FFFFFF; --teal: #0D9488; --sky: #38BDF8; --soft: #E3F4F2; --sky-soft: #E0F2FE;

}
@media (prefers-color-scheme: dark) {

    --accent: #2DD4BF; --accent-fg: #052B27; --teal: #2DD4BF; --sky: #38BDF8; --soft: #0E3B45; --sky-soft: #0F3552;
    --ok: #4ADE80; --warn: #FBBF24; --warn-soft: #3A2C0B; --err: #F87171; --contour: #173753; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1B2D; --surface: #102B46; --ink: #F1F5F9; --fg: #CBD5E1; --muted: #9DB0C6; --line: #24435F;
  --accent: #2DD4BF; --accent-fg: #052B27; --teal: #2DD4BF; --sky: #38BDF8; --soft: #0E3B45; --sky-soft: #0F3552;

}
* { box-sizing: border-box; }
html.bigtext body { font-size: 18px; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; padding-inline: 16px; padding-block: 0 40px; }

h1 { font-size: clamp(2.2rem, 6.4vw, 4rem); font-weight: 700; }
h2 { font-size: clamp(1.6rem, 4.2vw, 2.4rem); font-weight: 700; }
h3 { font-size: 1.2rem; font-weight: 600; }
h4 { font-size: 1rem; font-weight: 600; }
p { margin: 0; max-width: 65ch; }
a { color: var(--accent); }
.mono { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.container { max-width: 1120px; margin-inline: auto; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.between { justify-content: space-between; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

.cardx.flat { background: transparent; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--accent-fg); border: 2px solid var(--accent); border-radius: 999px; padding: 11px 22px; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn:hover { filter: brightness(1.08); }

.pill { display: inline-block; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }

.notice { background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); padding: 10px 14px; border-radius: 4px; font-size: 0.92rem; }

.notice.err { border-left-color: var(--err); }
.err { color: var(--err); font-weight: 600; }

/* site header */

.sitehead .container { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
.brand { display: flex; gap: 10px; align-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; color: var(--ink); background: none; border: 0; cursor: pointer; padding: 0; }
.nav { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.nav button { background: none; border: 0; cursor: pointer; padding: 6px 0; color: var(--fg); font-weight: 500; }
.nav button:hover { color: var(--accent); }
@media (max-width: 860px) { .nav.closed { display: none; } .nav { width: 100%; flex-direction: column; } .menubtn { display: inline-flex !important; } }
.menubtn { display: none; }

/* hero */
.hero { position: relative; margin-inline: -16px; padding: 56px 16px 64px; overflow: hidden; }
.hero svg.contours { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.hero .container { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; align-items: center; }
.hero .copy { display: flex; flex-direction: column; gap: 20px; }
.hero .lede { font-size: 1.18rem; }

.needle { transform-origin: 0 0; transition: transform 1.3s cubic-bezier(.3, 1.45, .5, 1); }
.dial { fill: var(--surface); stroke: var(--ink); }

html.calm .needle { transition: none; }

.section { padding-block: 72px 0; }
.section .head { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
.steps4 { counter-reset: s; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); list-style: none; padding: 0; margin: 0; }

details.faq { border-top: 1px solid var(--line); padding: 14px 0; }

.banner .btn { background: var(--sky); border-color: var(--sky); color: #06223a; }

.flinks { display: flex; flex-wrap: wrap; gap: 6px 18px; }

.opt { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; }

.opt.on { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }

pre.code { padding: 12px; overflow-x: auto; border-radius: 8px; margin: 0; }
.conf { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.conf label { position: relative; display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 0.85rem; background: var(--surface); }

.spin { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: sp 1s linear infinite; }

@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* app shell */
.appbar { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 10px 16px; }
.appbar .container { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 28px; padding-top: 24px; align-items: start; }
@media (max-width: 860px) { .shell { grid-template-columns: minmax(0, 1fr); } }
.side { position: sticky; top: 70px; display: flex; flex-direction: column; gap: 2px; }
@media (max-width: 860px) { .side { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 6px; } }
.side button { text-align: left; white-space: nowrap; background: none; border: 0; border-left: 3px solid transparent; padding: 9px 12px; cursor: pointer; font-weight: 500; border-radius: 0 6px 6px 0; }
.side button.on { border-left-color: var(--teal); background: var(--soft); color: var(--ink); font-weight: 600; }
@media (max-width: 860px) { .side button { border-left: 0; border-bottom: 3px solid transparent; border-radius: 6px 6px 0 0; } .side button.on { border-bottom-color: var(--teal); } }
.main { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.kpis { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.kpi { border-left: 3px solid var(--teal); padding: 4px 0 4px 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi b { font-family: var(--font-display); font-size: 1.5rem; color: var(--ink); line-height: 1.15; }
.sk { display: grid; grid-template-columns: minmax(110px, 190px) 1fr auto; gap: 12px; align-items: center; padding: 6px 0; }
.sk .track { position: relative; height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.sk .track i { position: absolute; inset: 0 auto 0 0; background: var(--teal); border-radius: 5px; }
.sk .track u { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--sky); }
.sk .zone { position: absolute; top: 0; bottom: 0; left: 60%; right: 0; background: repeating-linear-gradient(45deg, transparent 0 4px, var(--contour) 4px 5px); }
@media (max-width: 520px) { .sk { grid-template-columns: 1fr auto; } .sk .track { grid-column: 1 / -1; order: 3; } }
.radarbox svg { width: 100%; max-width: 440px; height: auto; display: block; margin-inline: auto; }
.rtext { fill: var(--fg); font-family: var(--font-body); font-size: 11px; }
.trail { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.stop { position: relative; padding: 0 0 22px 34px; border-left: 2px dashed var(--line); margin-left: 10px; }
.stop:last-child { border-left-color: transparent; }
.stop::before { content: ""; position: absolute; left: -11px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 3px solid var(--line); }
.stop.in_progress::before { border-color: var(--sky); }
.stop.submitted::before { border-color: var(--teal); background: var(--soft); }
.stop.completed::before { border-color: var(--ok); background: var(--ok); }
.task { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.task input { margin-top: 5px; accent-color: var(--accent); }
.coach { display: flex; flex-direction: column; gap: 12px; }
.chip { display: inline-flex; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 0.85rem; background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.slot { cursor: pointer; }
.slot.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.bell { position: relative; }
.drop { position: absolute; right: 0; top: 110%; width: min(320px, 86vw); z-index: 30; box-shadow: 0 10px 30px rgba(8, 25, 45, 0.18); }
.switch { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 10px; z-index: 50; max-width: min(520px, 92vw); font-size: 0.92rem; }

.themebtn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 0.85rem; }
</style>

function validateDraft(d) {
  const missing = QUESTIONS.filter(q => d.answers[q.id] === undefined);
  if (missing.length) return { ok: false, msg: "Please answer all six skill questions. Choosing \"I'm not sure\" is fine." };
  if (!d.skip && words(d.practical) < 25) return { ok: false, msg: "Add a little more to the practical task (at least 25 words), or tick the box to skip it. Skipping lowers what we can say about planning and portfolio." };
  return { ok: true };
}

function scoreAssessment(d, user) {
  const skills = SKILLS.map(s => ({ skillId: s.id, level: null, confidence: "low", evidenceIds: [], self: (d.conf && d.conf[s.id]) || null, note: "" }));
  const get = id => skills.find(s => s.skillId === id);
  const evidence = [];
  QUESTIONS.forEach((q, i) => {
    const a = d.answers[q.id];
    const sc = get(q.skill);
    const unsure = a === "unsure";
    sc.level = unsure ? 1 : q.options[a].l;
    if (unsure) sc.note = "You said you were not sure, so this is recorded as Exploring.";
    sc.evidenceIds.push("E-Q" + (i + 1));
    evidence.push({ id: "E-Q" + (i + 1), type: "Skill question", detail: q.prompt, skill: q.skill });
  });
  const text = d.skip ? "" : (d.practical || "");
  const w = words(text);
  const enough = w >= 25;
  if (text) {
    evidence.push({ id: "E-P1", type: "Practical task", detail: "Your written plan (" + w + " words)", skill: "plan" });
    Object.keys(KW).forEach(id => { if (enough && KW[id].test(text)) { const sc = get(id); sc.evidenceIds.push("E-P1"); sc.confidence = "medium"; } });
  }
  const link = (d.link || "").trim();
  const linkOk = /^https?:\/\/[^\s]+\.[^\s]+$/i.test(link);
  if (linkOk) evidence.push({ id: "E-L1", type: "Portfolio link", detail: "Provided but not opened or evaluated in this demo", skill: "portfolio" });
  const plan = get("plan"), port = get("portfolio");
  if (enough) {
    const planSig = [/first|then|next|step|milestone|phase|order/i, /small|simple|mvp|one page|minimal|scope/i, /checklist|track|task|issue|kanban|board|to-?do|notes/i, /test|check|review|feedback|phone|device/i].filter(r => r.test(text)).length;
    const portSig = [/about|projects?|contact|case stud|resume|\bcv\b/i, /recruiter|employer|visitor|audience|hiring|client|reader/i, /screenshot|live|demo|readme|result|what i (built|learned)|goal/i].filter(r => r.test(text)).length;
    plan.level = planSig === 0 ? 1 : planSig === 1 ? 2 : 3;
    port.level = portSig === 0 ? 1 : portSig === 1 ? 2 : 3;
    plan.evidenceIds.push("E-P1"); port.evidenceIds.push("E-P1");
    plan.confidence = w >= 40 ? "medium" : "low"; port.confidence = w >= 40 ? "medium" : "low";
  } else if (text) {
    plan.note = "The practical task was too short to assess."; port.note = plan.note;
  } else {
    plan.note = "No practical evidence was provided."; port.note = plan.note;
  }
  if (linkOk) port.evidenceIds.push("E-L1");

  const mismatch = [];
  skills.forEach(s => { if (s.self && s.level && s.self >= 4 && s.level <= 2) mismatch.push(s.skillId); });
  const evidenced = skills.filter(s => s.level !== null);
  const avg = evidenced.reduce((a, s) => a + s.level, 0) / evidenced.length;
  const overall = clamp(Math.round(avg), 1, MAX_LEVEL);
  const reviewNeeded = !enough || mismatch.length > 0;

  const ranked = evidenced.slice().sort((a, b) => a.level - b.level || TIE_ORDER.indexOf(a.skillId) - TIE_ORDER.indexOf(b.skillId));
  const priorityGaps = ranked.filter(s => s.level < MAX_LEVEL).slice(0, 3).map(s => s.skillId);
  const topStrengths = evidenced.filter(s => s.level >= 2).sort((a, b) => b.level - a.level || TIE_ORDER.indexOf(a.skillId) - TIE_ORDER.indexOf(b.skillId)).slice(0, 3).map(s => s.skillId);
  let nextId = priorityGaps.length ? SKILL_TO_MS[priorityGaps[0]] : "m_portfolio";
  if (user && user.help === "portfolio" && priorityGaps.includes("portfolio")) nextId = "m_portfolio";

  const uncertainty = [];
  skills.filter(s => s.level !== null && s.confidence === "low").forEach(s => uncertainty.push(SKILLS.find(x => x.id === s.skillId).name + ": based on a single piece of evidence, so confidence is low."));
  skills.filter(s => s.level === null).forEach(s => uncertainty.push(SKILLS.find(x => x.id === s.skillId).name + ": no evidence yet, so no level is shown."));
  mismatch.forEach(id => uncertainty.push(SKILLS.find(x => x.id === id).name + ": you felt more confident than the answer showed. That is common. A coach can help you find out why."));
  if (linkOk) uncertainty.push("Your portfolio link was not opened or evaluated in this demo.");
  return {
    assessmentId: "demo-" + Date.now().toString(36), careerTrackId: "web-development", rubricVersion: "web-dev-sample-0.1", mode: "demo",
    status: reviewNeeded ? "needs_human_review" : "completed",
    overallLevel: overall, skillScores: skills, topStrengths, priorityGaps, evidence,
    recommendedNextMilestoneId: nextId, uncertainty,
    limitations: [
      "Demo assessment: scored by a simple rule-based sample evaluator, not a live AI provider.",
      "The skill framework is a sample and has not been reviewed by practitioners.",
      "One short assessment cannot show job readiness. Levels 4 and 5 need reviewed work samples.",
      "Self-reported confidence is shown separately from what your answers demonstrated."
    ],
    createdAt: new Date().toISOString()
  };
}

function weeklyHours(h) { return { "lt2": 1.5, "2-4": 3, "5-7": 6, "8+": 9 }[h] || 3; }

function buildLearningPlan(result, user) {
  if (!result || result.mode === undefined) throw new Error("A validated assessment is required.");
  const ids = [];
  const add = id => { if (id && !ids.includes(id)) ids.push(id); };
  add(result.recommendedNextMilestoneId);
  result.priorityGaps.forEach(g => add(SKILL_TO_MS[g]));
  const picked = ids.slice(0, 3);
  const milestones = picked.map(id => {
    const m = MILESTONES[id];
    return { id: m.id, title: m.title, whyItMatters: m.why, targetSkills: m.skills, estimatedHours: m.hours, completionCriteria: m.criteria,
      tasks: m.tasks.map((t, i) => ({ id: id + "_t" + (i + 1), title: t[0], instructions: t[1], evidenceRequired: t[2] })), status: "not_started" };
  });
  const total = milestones.reduce((a, m) => a + m.estimatedHours, 0);
  const wk = weeklyHours(user && user.hours);
  return { planId: "plan-" + result.assessmentId, assessmentId: result.assessmentId, careerTrackId: result.careerTrackId, planVersion: "1", milestones,
    totalHours: total, approxWeeks: Math.max(1, Math.ceil(total / wk)), reviewRecommended: result.status === "needs_human_review" };
}

function matchCoaches(user, result, filters) {
  const gaps = result ? result.priorityGaps : [];
  return COACHES.map(c => {
    const reasons = [], missing = [];
    if (user.lang && c.langs.includes(user.lang)) reasons.push("Speaks " + user.lang);
    else if (user.lang) missing.push("Does not list " + user.lang);
    const gapHit = gaps.filter(g => c.skills.includes(g));
    if (gapHit.length) reasons.push("Lists your priority gap" + (gapHit.length > 1 ? "s" : "") + ": " + gapHit.map(g => SKILLS.find(s => s.id === g).short).join(", "));
    else if (gaps.length) missing.push("None of your priority gaps are listed");
    if (filters.format && filters.format !== "any") { if (c.formats.includes(filters.format)) reasons.push("Offers " + FORMAT_LABEL[filters.format].toLowerCase()); else missing.push("Does not offer " + FORMAT_LABEL[filters.format].toLowerCase()); }
    reasons.push("Has " + c.slots.length + " listed time slots");
    missing.push("Price, ratings and verification: not available in this prototype");
    const score = reasons.length - missing.filter(m => !m.startsWith("Price")).length;
    return { coach: c, reasons, missing, score };
  }).filter(m => (!filters.format || filters.format === "any" || m.coach.formats.includes(filters.format)) && (!filters.lang || filters.lang === "any" || m.coach.langs.includes(filters.lang)) && (!filters.skill || filters.skill === "any" || m.coach.skills.includes(filters.skill)))
    .sort((a, b) => b.score - a.score);
}

function contours() {
  let out = "";
  const cx = 880, cy = 260;
  for (let k = 0; k < 12; k++) {
    const r0 = 50 + k * 52; let d = "";
    for (let i = 0; i <= 120; i++) {
      const a = i / 120 * Math.PI * 2;
      const r = r0 * (1 + 0.09 * Math.sin(3 * a + k * 0.7) + 0.05 * Math.sin(5 * a + k * 1.3) + 0.03 * Math.sin(8 * a + k));
      d += (i ? "L" : "M") + (cx + Math.cos(a) * r * 1.25).toFixed(1) + " " + (cy + Math.sin(a) * r).toFixed(1);
    }
    out += '<path d="' + d + 'Z" fill="none" stroke="var(--contour)" stroke-width="' + (k % 4 === 0 ? 1.6 : 1) + '"/>';
  }
  return '<svg class="contours" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + out + "</svg>";
}
function compassSVG(deg) {
  let ticks = "";
  for (let i = 0; i < 72; i++) {
    const a = i * 5, long = i % 18 === 0, mid = i % 6 === 0, r1 = 170, r2 = long ? 148 : mid ? 156 : 162;
    const rad = (a - 90) * Math.PI / 180;
    ticks += '<line x1="' + (Math.cos(rad) * r1).toFixed(1) + '" y1="' + (Math.sin(rad) * r1).toFixed(1) + '" x2="' + (Math.cos(rad) * r2).toFixed(1) + '" y2="' + (Math.sin(rad) * r2).toFixed(1) + '" stroke="var(--ink)" stroke-width="' + (long ? 2 : 1) + '"/>';
  }
  const cards = [["N", 0, -128], ["E", 128, 5], ["S", 0, 138], ["W", -128, 5]].map(c => '<text x="' + c[1] + '" y="' + c[2] + '" text-anchor="middle" font-family="Familjen Grotesk, sans-serif" font-weight="700" font-size="22" fill="var(--ink)">' + c[0] + "</text>").join("");
  return '<svg class="compass" viewBox="-190 -190 380 380" role="img" aria-label="Compass needle pointing to bearing ' + deg + ' degrees"><circle r="184" class="dial" stroke-width="2"/><circle r="120" fill="none" stroke="var(--line)"/><circle r="70" fill="none" stroke="var(--line)" stroke-dasharray="3 5"/>' + ticks + cards +
    '<g class="needle" style="transform:rotate(' + deg + 'deg)"><polygon points="0,-112 11,0 -11,0" fill="var(--teal)"/><polygon points="0,112 11,0 -11,0" fill="var(--sky)" opacity="0.55"/><circle r="9" fill="var(--ink)"/><circle r="3" fill="var(--bg)"/></g></svg>';
}
function radar(result) {
  const R = 118, n = SKILLS.length;
  const pt = (i, lv) => { const a = (-90 + i * 360 / n) * Math.PI / 180, r = R * lv / 5; return [Math.cos(a) * r, Math.sin(a) * r]; };
  let g = "";
  for (let k = 1; k <= 5; k++) g += '<circle r="' + (R * k / 5) + '" fill="' + (k > MAX_LEVEL ? "var(--contour)" : "none") + '" fill-opacity="' + (k > MAX_LEVEL ? 0.25 : 1) + '" stroke="var(--line)"' + (k > MAX_LEVEL ? ' stroke-dasharray="4 4"' : "") + "/>";
  let ax = "", lb = "";
  SKILLS.forEach((s, i) => {
    const p = pt(i, 5), q = pt(i, 5.55);
    ax += '<line x1="0" y1="0" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="var(--line)"/>';
    const anchor = Math.abs(q[0]) < 8 ? "middle" : q[0] > 0 ? "start" : "end";
    lb += '<text class="rtext" x="' + q[0].toFixed(1) + '" y="' + (q[1] + 4).toFixed(1) + '" text-anchor="' + anchor + '">' + s.short + "</text>";
  });
  const sc = result.skillScores;
  const poly = key => sc.map((s, i) => pt(i, s[key] || 0).map(v => v.toFixed(1)).join(",")).join(" ");
  const hasSelf = sc.some(s => s.self);
  const dots = sc.map((s, i) => { const p = pt(i, s.level || 0); return s.level ? '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4" fill="var(--teal)" stroke="var(--surface)" stroke-width="1.5"/>' : '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.5" fill="var(--surface)" stroke="var(--muted)" stroke-dasharray="2 2"/>'; }).join("");
  const label = "Skill levels: " + sc.map(s => skillName(s.skillId) + " " + (s.level ? "level " + s.level : "no evidence")).join(", ");
  return '<svg viewBox="-205 -172 410 344" role="img" aria-label="' + esc(label) + '">' + g + ax +
    (hasSelf ? '<polygon points="' + poly("self") + '" fill="none" stroke="var(--sky)" stroke-width="2" stroke-dasharray="5 4"/>' : "") +
    '<polygon points="' + poly("level") + '" fill="var(--teal)" fill-opacity="0.28" stroke="var(--teal)" stroke-width="2.5"/>' + dots + lb + "</svg>";
}

/* ---------- assessment ---------- */
const A_STEPS = ["Getting started", "Skill questions", "Practical task", "Review"];
function viewAssess() {
  const d = S.draft;
  const prog = '<ol class="progress" aria-label="Assessment progress">' + A_STEPS.map((s, i) => '<li class="' + (i === d.step ? "on" : i < d.step ? "done" : "") + '"' + (i === d.step ? ' aria-current="step"' : "") + ">" + s + "</li>").join("") + "</ol>";
  let body = "";
  if (S.processing) {
    body = '<div class="cardx row" role="status"><div class="spin"></div><p>We\'re reviewing your responses against the selected skill framework. This may take a moment.</p></div>';
  } else if (d.step === 0) {
    body = '<div class="stack"><h2>Let\'s understand what you can do today.</h2><p>This is not a test of your worth or potential. It helps us identify what you already understand and what could be your next useful step.</p>' +
      '<div class="notice"><b>Demo assessment.</b> It has not been evaluated by a live AI provider and should not be treated as a real skill evaluation.</div>' +
      '<div class="grid"><div class="cardx"><h4>What will be evaluated</h4><ul class="tick"><li>Six skill questions</li><li>One short practical task</li><li>An optional portfolio link</li></ul></div><div class="cardx"><h4>About 15 minutes</h4><p>You can save and pause. Answer honestly. If you\'re unsure, it\'s okay to say so.</p></div><div class="cardx"><h4>Confidence is separate</h4><p>You can rate how confident you feel. We show that apart from what your answers demonstrate.</p></div></div>' +
      '<div class="row"><button class="btn" data-act="a-next">Begin</button>' + (S.saved ? '<button class="btn ghost" data-act="a-resume">Resume saved draft</button>' : "") + "</div></div>";
  } else if (d.step === 1) {
    body = '<div class="stack"><h2>Skill questions</h2>' + QUESTIONS.map((q, qi) => {
      const sel = d.answers[q.id];
      const opts = q.options.map((o, i) => ({ o, i })).concat([{ o: { t: "I'm not sure." }, i: "unsure" }]);
      return '<fieldset class="cardx stack" style="margin:0"><legend class="mono" style="padding:0 6px">' + skillName(q.skill) + "</legend><h3>" + (qi + 1) + ". " + esc(q.prompt) + "</h3>" + (q.code ? '<pre class="code">' + esc(q.code) + "</pre>" : "") +
        opts.map(x => '<label class="opt' + (String(sel) === String(x.i) ? " on" : "") + '" for="' + q.id + "-" + x.i + '"><input type="radio" id="' + q.id + "-" + x.i + '" name="' + q.id + '" data-act="ans" data-q="' + q.id + '" data-v="' + x.i + '"' + (String(sel) === String(x.i) ? " checked" : "") + "><span>" + esc(x.o.t) + "</span></label>").join("") +
        '<div class="conf" role="radiogroup" aria-label="How confident do you feel about ' + esc(skillName(q.skill)) + '?"><span class="muted">Confidence (optional):</span>' + [1, 2, 3, 4, 5].map(v => '<label class="' + (d.conf[q.skill] === v ? "on" : "") + '" for="cf-' + q.skill + "-" + v + '"><input type="radio" id="cf-' + q.skill + "-" + v + '" name="cf-' + q.skill + '" data-act="conf" data-s="' + q.skill + '" data-v="' + v + '"' + (d.conf[q.skill] === v ? " checked" : "") + ">" + v + "</label>").join("") + '<span class="muted">1 = low, 5 = high</span></div></fieldset>';
    }).join("") + "</div>";
  } else if (d.step === 2) {
    body = '<div class="stack"><h2>Practical task</h2><div class="cardx stack"><h3>Plan a one-page portfolio</h3><p>You are a junior developer building a one-page portfolio. Describe the sections you would include, how you would structure the HTML and CSS, how you would check it on a phone, and how you would track the work.</p>' +
      '<label class="f" for="practical">Your answer<textarea id="practical" data-bind="draft.practical" data-count="pcount" placeholder="Start with the goal of the page, then the sections, then how you would build and check it…"' + (d.skip ? " disabled" : "") + ">" + esc(d.practical) + '</textarea></label><span class="muted" id="pcount">' + words(d.practical) + " words (aim for 25 or more)</span>" +
      '<label class="f" for="link">Portfolio or project link (optional)<input type="url" id="link" data-bind="draft.link" value="' + esc(d.link) + '" placeholder="https://"></label><p class="muted">Do not share private credentials or passwords. In this demo the link is recorded but never opened.</p>' +
      '<div class="conf" role="radiogroup" aria-label="Confidence in planning"><span class="muted">Confidence in planning (optional):</span>' + [1, 2, 3, 4, 5].map(v => '<label class="' + (d.conf.plan === v ? "on" : "") + '" for="cf-plan-' + v + '"><input type="radio" id="cf-plan-' + v + '" name="cf-plan" data-act="conf" data-s="plan" data-v="' + v + '"' + (d.conf.plan === v ? " checked" : "") + ">" + v + "</label>").join("") + "</div>" +
      '<div class="conf" role="radiogroup" aria-label="Confidence in portfolio presentation"><span class="muted">Confidence presenting a portfolio (optional):</span>' + [1, 2, 3, 4, 5].map(v => '<label class="' + (d.conf.portfolio === v ? "on" : "") + '" for="cf-portfolio-' + v + '"><input type="radio" id="cf-portfolio-' + v + '" name="cf-portfolio" data-act="conf" data-s="portfolio" data-v="' + v + '"' + (d.conf.portfolio === v ? " checked" : "") + ">" + v + "</label>").join("") + "</div>" +
      '<label class="opt" for="skip"><input type="checkbox" id="skip" data-bind="draft.skip" data-rerender="1"' + (d.skip ? " checked" : "") + "><span>Skip the practical task for now. Planning and portfolio will show no level.</span></label></div>" +
      '<div class="fill-sample"><button class="linkbtn" data-act="fill-sample">Fill with sample answers (test data)</button></div></div>';
  } else {
    const answered = QUESTIONS.filter(q => d.answers[q.id] !== undefined).length;
    body = '<div class="stack"><h2>Review</h2><div class="cardx stack"><div class="row between"><span>Skill questions answered</span><b>' + answered + " of 6</b></div><div class=\"row between\"><span>Practical task</span><b>" + (d.skip ? "Skipped" : words(d.practical) + " words") + "</b></div><div class=\"row between\"><span>Portfolio link</span><b>" + (d.link.trim() ? "Provided (not opened)" : "None") + "</b></div></div>" +
      '<p class="notice">Demo assessment. A simple rule-based sample evaluator will score this. It is not a live AI provider.</p></div>';
  }
  const nav = S.processing ? "" : '<div class="err" role="alert">' + esc(S.aErr) + '</div><div class="row">' + (d.step > 0 ? '<button class="btn ghost" data-act="a-back">Back</button>' : '<button class="btn ghost" data-act="home">Leave</button>') +
    (d.step > 0 ? '<button class="btn ghost" data-act="a-save">Save and pause</button>' : "") +
    (d.step === 3 ? '<button class="btn" data-act="a-submit">Evaluate my assessment</button>' : d.step > 0 ? '<button class="btn" data-act="a-next">Continue</button>' : "") + "</div>";
  return '<div class="container" style="max-width:780px;padding-top:32px"><div class="stack"><div class="row between"><button class="brand" data-act="home">' + logo() + "Career Compass</button>" + prog + "</div>" + body + nav + "</div></div>";
}

  },
  "ms-withdraw"(d) { setMs(d.id, "in_progress"); },
  "req-open"(d) { S.reqOpen = d.id; S.reqErr = ""; const c = COACHES.find(x => x.id === d.id); S.reqForm = { goal: "", slots: [], type: c.formats[0] }; render(); },
  "req-close"() { S.reqOpen = null; render(); },
  slot(d, el) { const s = S.reqForm.slots; S.reqForm.slots = el.checked ? s.concat(d.s) : s.filter(x => x !== d.s); render(); },
  "req-send"(d) {
    if (S.reqForm.goal.trim().length < 10) { S.reqErr = "Tell the coach a little about what you want to achieve (at least 10 characters)."; render(); return; }
    if (!S.reqForm.slots.length) { S.reqErr = "Choose at least one preferred time slot."; render(); return; }
    const c = COACHES.find(x => x.id === d.id);
    S.requests.unshift({ id: "r" + Date.now(), coach: c.name, goal: S.reqForm.goal.trim(), slots: S.reqForm.slots, type: S.reqForm.type, status: "pending" });
    S.reqOpen = null; note("Coaching request recorded (demo: no coach contacted)."); render(); toast("Demo only: no real coach has been contacted or booked.");
  },
  "req-cancel"(d) { const r = S.requests.find(x => x.id === d.id); if (r) r.status = "cancelled"; render(); },
  "ask-review"() { S.reviews.unshift({ at: new Date().toISOString() }); note("Human review requested (demo: no reviewer notified)."); render(); toast("Recorded in this prototype only. No reviewer has been notified."); },
  "report-error"() { if (!(S.errText || "").trim()) { toast("Describe what looks wrong first."); return; } S.errorReports.push({ text: S.errText, at: new Date().toISOString() }); S.errText = ""; note("Error report recorded (demo)."); render(); toast("Recorded in this prototype only. No one has been notified."); },
  checkout(d) { S.billingMsg = "Demo only: no checkout was opened, no payment was taken, and your plan has not changed. A real plan change happens only after the payment provider confirms payment."; render(); },
  export() { S.exportOpen = !S.exportOpen; render(); },
  del() { S.delConfirm = true; render(); },
  "del-no"() { S.delConfirm = false; render(); },
  "del-yes"() { try { localStorage.removeItem("cc-draft"); } catch (e) { } const th = document.documentElement.getAttribute("data-theme"); S = fresh(); render(); window.scrollTo(0, 0); toast("Your data in this prototype has been deleted."); }
};
function setMs(id, status) { S.plan.milestones.find(m => m.id === id).status = status; render(); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT") return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.act && el.tagName === "INPUT") { const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el, e); return; }
  if (el.dataset && el.dataset.bind) { setPath(el.dataset.bind, el.type === "checkbox" ? el.checked : el.value); if (el.dataset.rerender) render(); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset && el.dataset.bind && el.type !== "checkbox" && el.tagName !== "SELECT") {
    setPath(el.dataset.bind, el.value);
    if (el.dataset.count) { const c = document.getElementById(el.dataset.count); if (c) c.textContent = words(el.value) + " words (aim for 25 or more)"; }
  }
});
render();
</script>
